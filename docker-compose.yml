services:
  db:
    image: postgres:17
    env_file: .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    env_file: .env.docker
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  nginx:
    image: nginx:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro

volumes:
  pg_data:
  media_data:
  static_data:
